name: Fetch news & calendar

# Runs every 2 hours to keep news and economic calendar fresh
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news and calendar
        run: python3 scripts/fetch_news.py

      - name: Commit changes
        run: |
          git config user.name "cot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/calendar.json
          if git diff --cached --quiet; then
            echo "No new news or calendar data - nothing to commit."
          else
            git commit -m "Auto-fetch news & calendar"
            git push
          fi
